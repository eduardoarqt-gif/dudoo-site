>\n      <div class="preview-topbar">\n        <div class="preview-dot"></div><div class="preview-dot"></div><div class="preview-dot"></div>\n        <div class="preview-title">Dudoo — Home</div>\n      </div>\n      <div class="preview-body">\n        <div class="preview-col">\n          <div class="preview-col-label">Projetos ativos</div>\n\n          <div class="proj-card">\n            <div class="ring" style="--pct:78%"><span>78%</span></div>\n            <div class="proj-meta">\n              <div class="proj-name">021-26 CASA UNA</div>\n              <div class="proj-sub">Executivo · Arquitetura + Interiores</div>\n            </div>\n            <div class="pill pill-ok">Em dia</div>\n          </div>\n\n          <div class="proj-card">\n            <div class="ring" style="--pct:34%"><span>34%</span></div>\n            <div class="proj-meta">\n              <div class="proj-name">014-26 STUDIO VÉRTICE</div>\n              <div class="proj-sub">Anteprojeto · Comercial</div>\n            </div>\n            <div class="pill pill-warn">Em revisão</div>\n          </div>\n\n          <div class="proj-card">\n            <div class="ring" style="--pct:91%"><span>91%</span></div>\n            <div class="proj-meta">\n              <div class="proj-name">009-25 RESIDÊNCIA ARARIBÁ</div>\n              <div class="proj-sub">Obra · Acompanhamento</div>\n            </div>\n            <div class="pill pill-late">2 dias atraso</div>\n          </div>\n        </div>\n\n        <div class="preview-col">\n          <div class="preview-col-label">Atenções</div>\n          <div class="attn-item">\n            <div class="attn-dot" style="background:var(--error)"></div>\n            <div>\n              <div class="attn-text">Etapa de compatibilização vence hoje</div>\n              <div class="attn-proj">009-25 RESIDÊNCIA ARARIBÁ</div>\n            </div>\n          </div>\n          <div class="attn-item">\n            <div class="attn-dot" style="background:var(--alert)"></div>\n            <div>\n              <div class="attn-text">Cliente pediu revisão do layout</div>\n              <div class="attn-proj">014-26 STUDIO VÉRTICE</div>\n            </div>\n          </div>\n          <div class="attn-item">\n            <div class="attn-dot" style="background:var(--alert)"></div>\n            <div>\n              <div class="attn-text">Proposta aguardando aprovação há 3 dias</div>\n              <div class="attn-proj">022-26 EDIFÍCIO OLINDA</div>\n            </div>\n          </div>\n          <div class="attn-item">\n            <div class="attn-dot" style="background:var(--success)"></div>\n            <div>\n              <div class="attn-text">Ata da reunião de obra pronta pra revisão</div>\n              <div class="attn-proj">021-26 CASA UNA</div>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<hr class="divider">\n\n<section class="section-pad reveal">\n  <div class="wrap">\n    <span class="sheet-tag">Diferencial</span>\n    <div class="section-head">\n      <h2>Isso não é mais um gerenciador de tarefas genérico.</h2>\n      <p>Board de tarefas não entende frente de obra, revisão de cliente\n      ou RT. O Dudoo nasceu dentro de um escritório de arquitetura pra\n      cobrir o ciclo inteiro de um projeto — do primeiro contato ao\n      arquivamento.</p>\n    </div>\n\n    <div class="feature-grid">\n      <div class="feature-card">\n        <div class="feature-num">01</div>\n        <h3>Projetos por frente</h3>\n        <p>Etapas técnicas, checklist e progresso separados por\n        disciplina — arquitetura, interiores, obra — sem misturar tudo\n        num board só.</p>\n      </div>\n      <div class="feature-card">\n        <div class="feature-num">02</div>\n        <h3>Comercial</h3>\n        <p>Orçamento, proposta e contrato num fluxo só, com histórico de\n        todas as revisões até a conversão em projeto.</p>\n      </div>\n      <div class="feature-card">\n        <div class="feature-num">03</div>\n        <h3>Financeiro</h3>\n        <p>Contas a receber e a pagar por projeto, extrato do\n        escritório, RT e comissões — sem depender de três planilhas\n        diferentes.</p>\n      </div>\n      <div class="feature-card">\n        <div class="feature-num">04</div>\n        <h3>Reuniões</h3>\n        <p>Transcrição e ata gerada automaticamente, com ações e\n        pendências extraídas da conversa — nada pra digitar depois.</p>\n      </div>\n      <div class="feature-card">\n        <div class="feature-num">05</div>\n        <h3>Obra</h3>\n        <p>Visitas registradas, cronograma e fornecedores de execução\n        vinculados ao projeto certo.</p>\n      </div>\n      <div class="feature-card">\n        <div class="feature-num">06</div>\n        <h3>Portal do cliente</h3>\n        <p>Aprovação, avisos e comunicação num canal só — sem "como tá\n        indo o projeto?" toda semana.</p>\n      </div>\n    </div>\n  </div>\n</section>\n\n<hr class="divider">\n\n<section class="section-pad reveal">\n  <div class="wrap">\n    <span class="sheet-tag">Instalado no computador</span>\n    <div class="section-head">\n      <h2>Um programa de verdade no seu computador, não uma página de navegador.</h2>\n      <p>O Dudoo é instalado no computador do escritório. É isso que permite o\n      que um sistema aberto no navegador não consegue: trabalhar com os\n      arquivos reais dos seus projetos, nas pastas do seu próprio computador,\n      e mantê-los organizados sem você precisar lembrar.</p>\n    </div>\n\n    <div class="feature-grid">\n      <div class="feature-card">\n        <div class="feature-num">01</div>\n        <h3>Pastas de projeto sempre no mesmo padrão</h3>\n        <p>Cada projeto nasce com a estrutura de pastas do escritório, e é\n        nela que o Dudoo guarda o que gera: atas, relatórios, renders e\n        propostas. Ninguém mais pergunta "onde foi parar aquele arquivo?".</p>\n      </div>\n      <div class="feature-card">\n        <div class="feature-num">02</div>\n        <h3>Anexo que cai na pasta certa</h3>\n        <p>Arquivos que chegam por WhatsApp ou e-mail são salvos direto na\n        pasta do projeto certo — sem baixar, renomear e arrastar na mão.</p>\n      </div>\n      <div class="feature-card">\n        <div class="feature-num">03</div>\n        <h3>Seus arquivos continuam seus</h3>\n        <p>Plantas, modelos e PDFs seguem como arquivos comuns, em pastas\n        comuns do seu computador e da nuvem que você já usa. Nada fica preso\n        dentro de um site.</p>\n      </div>\n    </div>\n\n    <div class="ba-grid" style="margin-top:32px">\n      <div class="ba-col before">\n        <div class="ba-head">Sistema só no navegador</div>\n        <ul class="ba-list">\n          <li>Enxerga só o que foi digitado ou enviado pra ele</li>\n          <li>Os arquivos do projeto ficam fora, soltos em outro lugar</li>\n          <li>Cada anexo precisa ser baixado e guardado na mão</li>\n        </ul>\n      </div>\n      <div class="ba-col after">\n        <div class="ba-head">Dudoo instalado</div>\n        <ul class="ba-list">\n          <li>Trabalha direto com as pastas do seu computador</li>\n          <li>Documentos e arquivos do projeto no mesmo lugar, sempre</li>\n          <li>Anexos arquivados no projeto com um clique</li>\n        </ul>\n      </div>\n    </div>\n  </div>\n</section>\n\n<hr class="divider">\n\n<section class="section-pad reveal">\n  <div class="wrap">\n    <span class="sheet-tag">Índice</span>\n    <div class="section-head">\n      <h2>Tudo que o Dudoo faz, categoria por categoria.</h2>\n      <p>O menu principal do Dudoo reúne mais de dez áreas. Aqui vai o que cada uma\n      faz de verdade — sem ficar só na amostra da seção anterior.</p>\n    </div>\n\n    <div class="menu-grid">\n      <div class="menu-card">\n        <h3>Home</h3>\n        <ul class="menu-list">\n          <li><b>Painel Atenções</b> — só o que exige ação agora, nunca uma lista do que já está sob controle.</li>\n          <li><b>Ações rápidas</b> — novo projeto, lead, cliente, orçamento ou reunião num clique.</li>\n          <li><b>Consulta inteligente</b> — pergunte por <code class="at-inline">@projeto</code> ou <code class="at-inline">@cliente</code>.</li>\n          <li><b>Cronômetro de horas</b> — aponta tempo por etapa, direto do app, sem ferramenta separada.</li>\n        </ul>\n      </div>\n      <div class="menu-card">\n        <h3>Agenda</h3>\n        <ul class="menu-list">\n          <li><b>Tudo num calendário só</b> — compromissos, reuniões e visitas de obra do escritório, sincronizados com o Google Agenda.</li>\n          <li><b>Visitas agendadas</b> — programe as visitas à obra (inclusive repetindo toda semana) e elas aparecem no projeto certo.</li>\n        </ul>\n      </div>\n      <div class="menu-card">\n        <h3>Projetos</h3>\n        <ul class="menu-list">\n          <li><b>Visão geral e timeline</b> — histórico de decisões, alterações e prazos num só lugar.</li>\n          <li><b>Etapas técnicas por frente</b> — checklist e progresso separados por disciplina.</li>\n          <li><b>Reuniões</b> — transcrição e ata automática, com ações e pendências extraídas da conversa.</li>\n          <li><b>Aba Obra</b> — visitas, cronograma e fornecedores de execução do projeto.</li>\n          <li><b>Aba Cliente Web</b> — portal de aprovação e avisos, escopado àquele projeto.</li>\n          <li><b>Apresentação automática</b> — monta o PowerPoint a partir dos dados já cadastrados.</li>\n          <li><b>Documentos e arquivamento</b> — tudo organizado; projeto finalizado não perde histórico.</li>\n                  <li><b>Elétrica, iluminação e hidrossanitário</b> — pontos na planta com símbolos padronizados e quantitativo por ambiente.</li>\n          <li><b>Quantitativos e cotações</b> — compare fornecedores item a item e leve o escolhido direto pro orçamento.</li>\n          <li><b>Aprovação na prefeitura</b> — checklist por município (Florianópolis, São José, Palhoça) e parâmetros por zona: afastamentos, vagas e pé-direito.</li>\n          <li><b>Visita de obra pelo WhatsApp</b> — fotos e notas viram relatório pronto, publicado no Portal do cliente.</li>\n          <li><b>Dudoo Web no iPhone</b> — crie tarefas e consulte o projeto do celular; tudo cai no Dudoo do computador.</li>\n        </ul>\n      </div>\n      <div class="menu-card">\n        <h3>Render</h3>\n        <ul class="menu-list">\n          <li><b>Render com IA no projeto</b> — Print, implantação, humanização e edição de imagens a partir do seu modelo, tudo no mesmo lugar.</li>\n          <li><b>Fila de todos os projetos</b> — acompanhe o que está sendo gerado em cada obra sem abrir projeto por projeto.</li>\n          <li><b>Galeria pra divulgação</b> — todos os renders do escritório reunidos, prontos pra escolher a imagem de um post.</li>\n        </ul>\n      </div>\n      <div class="menu-card">\n        <h3>Cadastros</h3>\n        <ul class="menu-list">\n          <li><b>Clientes</b> — dados, vínculos entre cadastros (cônjuge, sócio) e preferências.</li>\n          <li><b>Colaboradores</b> — equipe do escritório, permissões e apontamento de horas.</li>\n          <li><b>Fornecedores</b> — por categoria e ofício, já prontos pra vincular à obra.</li>\n        </ul>\n      </div>\n      <div class="menu-card">\n        <h3>Comercial</h3>\n        <ul class="menu-list">\n          <li><b>Orçamento</b> — calculadora com histórico de todas as revisões.</li>\n          <li><b>Proposta e contrato</b> — gerados a partir do mesmo orçamento aprovado.</li>\n          <li><b>Funil de leads</b> — captação, qualificado, reunião, proposta e contrato num Kanban só.</li>\n          <li><b>Análise de tráfego pago</b> — IA lê campanhas Meta e recomenda onde investir.</li>\n        </ul>\n      </div>\n      <div class="menu-card">\n        <h3>Acervo ES</h3>\n        <ul class="menu-list">\n          <li><b>Biblioteca de produtos e blocos</b> — louças, metais e itens de fabricantes reais (Deca, Docol, Kohler, Franke), organizados por marca e categoria.</li>\n          <li><b>Do acervo pro projeto</b> — o item escolhido entra no orçamento e nos quantitativos sem redigitar nada.</li>\n        </ul>\n      </div>\n      <div class="menu-card">\n        <h3>Marketing</h3>\n        <ul class="menu-list">\n          <li><b>Sugestão de post</b> — a IA monta tema, legenda e fotos a partir dos projetos aprovados.</li>\n          <li><b>Peça visual e vídeo de Stories</b> — gerados na identidade visual do escritório.</li>\n          <li><b>Calendário de conteúdo</b> — planejamento e status de cada publicação.</li>\n          <li><b>Estrategista de tendências</b> — sugere temas que não dependem de foto de projeto.</li>\n        </ul>\n      </div>\n      <div class="menu-card">\n        <h3>WhatsApp</h3>\n        <ul class="menu-list">\n          <li><b>Conversas centralizadas</b> — sem depender do celular de uma pessoa só.</li>\n          <li><b>Rascunho e sugestão de resposta</b> — a IA propõe, você aprova antes de enviar.</li>\n        </ul>\n      </div>\n      <div class="menu-card">\n        <h3>E-mail</h3>\n        <ul class="menu-list">\n          <li><b>Caixa de entrada do escritório</b> — e-mails e anexos de orçamento chegam ao Dudoo e são ligados ao projeto certo.</li>\n          <li><b>Envio ao cliente</b> — relatório de visita e fotos seguem por e-mail com o link do Portal, já com a assinatura do escritório.</li>\n        </ul>\n      </div>\n      <div class="menu-card">\n        <h3>Financeiro</h3>\n        <ul class="menu-list">\n          <li><b>Contas a receber e a pagar</b> — por projeto e do escritório, num só lugar.</li>\n          <li><b>RT, comissões e conciliação</b> — sem depender de planilha paralela.</li>\n          <li><b>Integração Asaas</b> — cobrança e status de pagamento sincronizados.</li>\n        </ul>\n      </div>\n      <div class="menu-card">\n        <h3>Ferramentas</h3>\n        <ul class="menu-list">\n          <li><b>Consulta de preços</b> — busca na base histórica do escritório, com faixa de valores e de onde veio cada preço.</li>\n          <li><b>Custo por m² e obras de referência</b> — compare sua obra com orçamentos reais já fechados.</li>\n          <li><b>Notas, quadro e tempo trabalhado</b> — anotações, quadro de ideias e apontamento de horas por projeto.</li>\n          <li><b>Relatórios do escritório</b> — visão do portfólio e dos números do negócio num lugar só.</li>\n        </ul>\n      </div>\n      <div class="menu-card">\n        <h3>Dudoo Web no iPhone</h3>\n        <ul class="menu-list">\n          <li><b>Tarefas de onde estiver</b> — crie tarefas pelo celular e elas aparecem no Dudoo do computador, no projeto certo.</li>\n          <li><b>Mesmo menu do computador</b> — nada novo pra aprender: o que você usa no PC está no mesmo lugar no iPhone.</li>\n        </ul>\n      </div>\n    </div>\n  </div>\n</section>\n\n<hr class="divider">\n\n<section class="section-pad blueprint reveal">\n  <div class="wrap">\n    <span class="sheet-tag">Manifesto</span>\n    <div class="manifesto">\n      <div>\n        <p class="manifesto-quote">\n          "Eu sou <strong>arquiteto</strong>. Antes de escrever a\n          primeira linha do Dudoo, eu já tinha vivido o problema que ele\n          resolve."\n        </p>\n        <p class="manifesto-body">\n          Cansei de gambiarra com planilha, grupo de WhatsApp e\n          ferramenta genérica de gestão que não entendia nada do meu\n          dia a dia — RT, etapa técnica, revisão de cliente, prazo de\n          obra. Construí o Dudoo porque eu precisava dele no meu próprio\n          escritório, não porque eu queria vender software. Cada tela\n          existe porque resolveu um problema real, com dados reais, num\n          escritório rodando de verdade — não numa planilha de\n          especificação.\n        </p>\n      </div>\n      <div class="titleblock">\n        <div class="titleblock-row"><div class="k">Projeto</div><div class="v">Dudoo</div></div>\n        <div class="titleblock-row"><div class="k">Autor</div><div class="v">Eduardo Schmidt Arquitetura</div></div>\n        <div class="titleblock-row"><div class="k">Escopo</div><div class="v">Gestão do escritório inteiro</div></div>\n        <div class="titleblock-row"><div class="k">Origem</div><div class="v">Uso real, diário, desde o primeiro projeto</div></div>\n        <div class="titleblock-sig">Eduardo Schmidt</div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<hr class="divider">\n\n<section class="section-pad reveal">\n  <div class="wrap">\n    <span class="sheet-tag">Inteligência</span>\n    <div class="section-head">\n      <h2>Pergunte pelo projeto. O Dudoo responde olhando os dados reais dele.</h2>\n      <p>A consulta é sempre amarrada a um projeto ou cliente —\n      <code class="at-inline">@009-25</code> ou\n      <code class="at-inline">@Deane</code> — nunca uma pergunta solta\n      sobre o escritório inteiro. Menos chatbot genérico, mais resposta\n      que bate com o que está registrado de verdade.</p>\n    </div>\n\n    <div class="chat-frame">\n      <div class="bubble bubble-user"><span class="at-tag">@009-25</span> quais as pendências desse projeto?</div>\n      <div class="bubble bubble-duda">\n        <div class="bh">Dudoo — 009-25 RESIDÊNCIA ARARIBÁ</div>\n        2 pendências em aberto:\n        <ul class="bubble-list">\n          <li><span>Visita técnica não registrada</span><span class="days">2 dias</span></li>\n          <li><span>Orçamento de obra aguardando aprovação</span><span class="days">3 dias</span></li>\n        </ul>\n      </div>\n    </div>\n  </div>\n</section>\n\n<hr class="divider">\n\n<section class="section-pad reveal">\n  <div class="wrap">\n    <span class="sheet-tag">Portal do cliente</span>\n    <div class="portal-grid">\n      <div>\n        <h2 style="font-size:clamp(26px,3.6vw,34px);font-weight:500;margin:0 0 16px;">\n          Um canal só com o cliente, sem perder o controle.\n        </h2>\n        <ul class="portal-list">\n          <li>Cliente aprova etapa, imagem e revisão direto no portal.</li>\n          <li>Avisos urgentes chegam sem depender de ligação ou WhatsApp.</li>\n          <li>Nada que o cliente faz altera a memória técnica sem\n          confirmação do escritório.</li>\n          <li>Timeline do projeto visível ao cliente, sempre atualizada.</li>\n        </ul>\n      </div>\n      <div class="portal-card">\n        <div class="head">\n          <div class="t">Portal do cliente</div>\n          <div class="t">021-26 CASA UNA</div>\n        </div>\n        <div class="approve-row">\n          <span class="name">Planta baixa — Revisão 03</span>\n          <span class="btnmini">Aprovado</span>\n        </div>\n        <div class="approve-row">\n          <span class="name">Paginação de piso — banheiros</span>\n          <span class="btnmini" style="background:var(--alert)">Aguardando</span>\n        </div>\n        <div class="approve-row">\n          <span class="name">Orçamento de obra — R.02</span>\n          <span class="btnmini">Aprovado</span>\n        </div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<hr class="divider">\n\n<section class="section-pad reveal">\n  <div class="wrap">\n    <span class="sheet-tag">Antes / Depois</span>\n    <div class="section-head">\n      <h2>A diferença não é a ferramenta. É a rotina.</h2>\n    </div>\n    <div class="ba-grid">\n      <div class="ba-col before">\n        <div class="ba-head">Antes</div>\n        <ul class="ba-list">\n          <li>Ata perdida num grupo de WhatsApp</li>\n          <li>Orçamento que só existe na sua cabeça</li>\n          <li>Cliente ligando pra saber "como tá o projeto"</li>\n          <li>Financeiro espalhado em três planilhas</li>\n          <li>Prazo que passa batido até alguém notar</li>\n        </ul>\n      </div>\n      <div class="ba-col after">\n        <div class="ba-head">Com o Dudoo</div>\n        <ul class="ba-list">\n          <li>Ata gerada sozinha, arquivada dentro do projeto</li>\n          <li>Orçamento com histórico de todas as revisões</li>\n          <li>Cliente acompanha tudo pelo portal, sem te ligar</li>\n          <li>Financeiro do projeto e do escritório num só lugar</li>\n          <li>Painel Atenções avisa antes do prazo estourar</li>\n        </ul>\n      </div>\n    </div>\n  </div>\n</section>\n\n<hr class="divider">\n\n<section class="section-pad reveal">\n  <div class="wrap">\n    <span class="sheet-tag">Investimento</span>\n    <div class="section-head">\n      <h2>Mensalidade por porte do escritório, sem módulo escondido.</h2>\n      <p>O Núcleo — Home, Projetos, Cadastros e Comercial — vem incluso\n      em todo plano. Financeiro, Cliente Web, Obra e IA/Automação entram\n      como módulo à parte, conforme o que o seu escritório realmente\n      usa.</p>\n    </div>\n\n    <div class="price-grid">\n      <div class="price-card">\n        <div class="plan-name">Individual</div>\n        <div class="plan-value">R$ 399<small>/mês</small></div>\n        <div class="plan-users">até 1 usuário</div>\n      </div>\n      <div class="price-card">\n        <div class="plan-name">Equipe pequena</div>\n        <div class="plan-value">R$ 599<small>/mês</small></div>\n        <div class="plan-users">até 3 usuários</div>\n      </div>\n      <div class="price-card featured">\n        <span class="badge">Mais vendido</span>\n        <div class="plan-name">Escritório</div>\n        <div class="plan-value">R$ 699<small>/mês</small></div>\n        <div class="plan-users">até 5 usuários</div>\n      </div>\n      <div class="price-card">\n        <div class="plan-name">Escritório Pro</div>\n        <div class="plan-value">R$ 999<small>/mês</small></div>\n        <div class="plan-users">até 10 usuários</div>\n      </div>\n    </div>\n\n    <div class="price-note">\n      <div class="item"><b>Implantação padrão:</b> R$ 2.490</div>\n      <div class="item"><b>Com migração ou Wix complexo:</b> a partir de R$ 4.990</div>\n      <div class="item"><b>Escritório piloto:</b> R$ 990 a R$ 1.490</div>\n    </div>\n\n    <p class="price-fine">\n      Valor final = usuários + módulos contratados (Financeiro, Cliente\n      Web, Obra, IA/Automação — precificados conforme o escopo do seu\n      escritório). Implantação inclui instalação, perfil do escritório,\n      integrações e acompanhamento nos primeiros 30 dias. Impostos,\n      descontos anuais e franquia de IA são definidos na proposta.\n    </p>\n  </div>\n</section>\n\n<section id="convite" class="section-pad reveal">\n  <div class="wrap">\n    <span class="sheet-tag" style="justify-content:center">Ficha de interesse</span>\n    <div class="section-head" style="margin:0 auto 40px;text-align:center;max-width:560px;">\n      <h2>Quer ver o Dudoo rodando com um projeto de verdade?</h2>\n    </div>\n\n    <form class="lead-card" id="form-interesse-duda">\n      <div class="lead-grid">\n        <div class="lead-field full">\n          <label for="duda-nome">Nome</label>\n          <input id="duda-nome" name="nome" type="text" required>\n        </div>\n        <div class="lead-field">\n          <label for="duda-escritorio">Escritório</label>\n          <input id="duda-escritorio" name="empresa" type="text" required>\n        </div>\n        <div class="lead-field">\n          <label for="duda-colaboradores">Nº de colaboradores</label>\n          <input id="duda-colaboradores" name="segmento" type="text" placeholder="Ex.: 3">\n        </div>\n        <div class="lead-field">\n          <label for="duda-email">E-mail</label>\n          <input id="duda-email" name="email" type="email" required>\n        </div>\n        <div class="lead-field">\n          <label for="duda-whatsapp">WhatsApp</label>\n          <input id="duda-whatsapp" name="whatsapp" type="tel" required>\n        </div>\n        <div class="lead-field full">\n          <label for="duda-mensagem">O que mais te incomoda hoje na gestão do escritório? (opcional)</label>\n          <textarea id="duda-mensagem" name="mensagem"></textarea>\n        </div>\n      </div>\n      <label class="lead-consent" for="duda-consent"><input type="checkbox" id="duda-consent" name="consentimento" required><span>Concordo que meus dados sejam guardados para este contato.</span></label>\n      <button class="btn btn-primary lead-submit" type="submit">Marcar uma conversa</button>\n      <div class="lead-note">Ao enviar, você autoriza a Eduardo Schmidt Arquitetura a guardar estes dados para responder ao seu interesse no Dudoo. Para pedir a exclusão, é só avisar pelo contato do site.</div>\n      <div class="lead-ok" id="duda-ok">Dados enviados.</div>\n      <div class="lead-err" id="duda-err" role="alert">Não conseguimos enviar agora. Tente de novo ou fale pelo WhatsApp ou e-mail do site.</div>\n    </form>\n  </div>\n</section>\n\n<section class="closing">\n  <div class="wrap">\n    <h2>Você entrou na arquitetura pra <em>projetar</em>.<br>Não pra apagar incêndio.</h2>\n    <div class="sub">O Dudoo cuida do resto.</div>\n  </div>\n</section>\n\n<footer>\n  <div class="wrap footer-grid">\n    <div>\n      <div class="footer-mark"><img class="logo-icon" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAAEACAYAAABccqhmAAC7j0lEQVR42t39adQtx3UdCO4Tmfd+0xvx8AA8PMwgJoIgMXKmCFIqDaQkSqQBSrZlqass27Jsycuuds+LZFV3uVbXqqpe3csut8p2V7XdZZtUS7IpebZIiRQlUYRIcAIJECBmPIxv+KY7ZMbpHxnDiciIyLzfgyS7gfUW8L7h3ryZESfO2WefvQl/wv8wswLAs9n5G9SkvXu2u/+bR46c1gDmAK4FUDVoLlucf/Wm2d6rt++fe/Wa5Xzv8HK+fQmWyxu1bg61zR41iz2gbdG2LcAtiDU0M4gIWmuACOTfEwBARKnr6f1dKdX7eup7ROT+X/68/H97Pan3sX9y12Z/zn4vdW3x9+U1yX/sz2ite9ee+rrWOvta8TXHP2N/V16T/Fruc+auf+hz2WtXSiWfhfyZ1DXLz9P9AVQ1BWOKqlZoqd6pJ5PtyWSitraOn0e99nS9cfi1w8dOvnL0kivPVluX/tvDhw9/ebK2cWE53z9FRC8wf31K9KYFb79wGS7oHVx55b55D/6T3H/0J7jxSX54ZiYApwFc3y4WV7z2wrfuavbP3Ld39rVbl7sXrtDL3RqqAZolWt2CdQO9XIA1Q9MUUBUqYjADTAowC4S6u9xbdKlNG/ydGRxtltSCS23A0
