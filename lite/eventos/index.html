const NEGOCIOS = {"advocacia": "\n<nav class=\"nav\">\n  <div class=\"nav-inner\">\n    <div class=\"nav-mark\"><img class=\"logo-icon\" src=\"{{LOGO}}\" width=\"30\" height=\"30\" alt=\"Dudoo\"> Dudoo<span>Lite</span></div>\n    <a class=\"nav-cta\" href=\"#interesse\">Quero conhecer</a>\n  </div>\n</nav>\n\n<header class=\"hero blueprint\">\n  <div class=\"wrap\">\n    <div class=\"hero-eyebrow\">Gestão enxuta para advocacia</div>\n    <img class=\"hero-logo\" src=\"{{LOGO}}\" width=\"64\" height=\"64\" alt=\"Dudoo Lite\">\n    <h1>DUDOO LITE</h1>\n    <p class=\"hero-slogan\">Prazo, processo e honorário no mesmo lugar.</p>\n    <p class=\"hero-pain\">\n      <strong>O escritório cresceu. O controle não acompanhou.</strong>\n      Prazo de intimação no caderno, andamento na planilha, honorário no WhatsApp e hora trabalhada na memória. Basta uma publicação esquecida para o custo aparecer.\n    </p>\n    <div class=\"hero-actions\">\n      <a class=\"btn btn-primary\" href=\"#interesse\">Quero conhecer o Dudoo Lite</a>\n      <a class=\"btn btn-ghost\" href=\"#previa\">Ver como funciona ↓</a>\n    </div>\n  </div>\n</header>\n\n<section id=\"previa\" class=\"section-pad reveal\">\n  <div class=\"wrap\">\n    <span class=\"sheet-tag\">Fl.02 — Prévia</span>\n    <div class=\"section-head\">\n      <h2>Processos, prazos e honorários, num lugar só.</h2>\n      <p>Cada processo guarda partes, andamentos, prazos, audiências, custas e honorários, ligado ao cadastro do cliente. A tela inicial mostra o que exige ação agora, não uma lista de tudo o que já está em dia.</p>\n    </div>\n    <div class=\"preview-frame\">\n      <div class=\"preview-topbar\">\n        <div class=\"preview-dot\"></div><div class=\"preview-dot\"></div><div class=\"preview-dot\"></div>\n        <div class=\"preview-title\">Dudoo Lite — Home</div>\n      </div>\n      <div class=\"preview-body\">\n        <div class=\"preview-col\">\n          <div class=\"preview-col-label\">Processos em andamento</div>\n          <div class=\"proj-card\">\n            <div class=\"ring\" style=\"--pct:70%\"><span>70%</span></div>\n            <div class=\"proj-meta\">\n              <div class=\"proj-name\">Reclamação trabalhista</div>\n              <div class=\"proj-sub\">Cliente Andrade · Audiência dia 18</div>\n            </div>\n            <div class=\"pill pill-warn\">Prazo próximo</div>\n          </div>\n          <div class=\"proj-card\">\n            <div class=\"ring\" style=\"--pct:100%\"><span>100%</span></div>\n            <div class=\"proj-meta\">\n              <div class=\"proj-name\">Inventário Souza</div>\n              <div class=\"proj-sub\">Família e sucessões · Em dia</div>\n            </div>\n            <div class=\"pill pill-ok\">Em dia</div>\n          </div>\n          <div class=\"proj-card\">\n            <div class=\"ring\" style=\"--pct:40%\"><span>40%</span></div>\n            <div class=\"proj-meta\">\n              <div class=\"proj-name\">Ação de cobrança</div>\n              <div class=\"proj-sub\">Cível · 2 providências pendentes</div>\n            </div>\n            <div class=\"pill pill-late\">Atenção</div>\n          </div>\n        </div>\n        <div class=\"preview-col\">\n          <div class=\"preview-col-label\">Atenções</div>\n          <div class=\"attn-item\">\n            <div class=\"attn-dot\" style=\"background:var(--error)\"></div>\n            <div>\n              <div class=\"attn-text\">Prazo vence amanhã (dias úteis)</div>\n              <div class=\"attn-proj\">Reclamação trabalhista</div>\n            </div>\n          </div>\n          <div class=\"attn-item\">\n            <div class=\"attn-dot\" style=\"background:var(--alert)\"></div>\n            <div>\n              <div class=\"attn-text\">Conferir publicações no diário oficial</div>\n              <div class=\"attn-proj\">Lembrete do escritório</div>\n            </div>\n          </div>\n          <div class=\"attn-item\">\n            <div class=\"attn-dot\" style=\"background:var(--alert)\"></div>\n            <div>\n              <div class=\"attn-text\">Proposta de honorários aguardando aprovação</div>\n              <div class=\"attn-proj\">Cliente Andrade</div>\n            </div>\n          </div>\n          <div class=\"attn-item\">\n            <div class=\"attn-dot\" style=\"background:var(--success)\"></div>\n            <div>\n              <div class=\"attn-text\">Honorário recebido</div>\n              <div class=\"attn-proj\">Inventário Souza</div>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<hr class=\"divider\">\n\n<section class=\"section-pad reveal\">\n  <div class=\"wrap\">\n    <span class=\"sheet-tag\">Fl.03 — Diferencial</span>\n    <div class=\"section-head\">\n      <h2>Feito para o dia a dia de quem advoga.</h2>\n      <p>Sistema genérico de gestão não conta prazo em dia útil, não separa êxito de honorário fixo e não sabe o que é uma intimação. O Dudoo Lite nasceu do núcleo do Dudoo, usado todo dia em um escritório de verdade, e ganhou o jeito da advocacia.</p>\n    </div>\n    <div class=\"feature-grid\">\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">01</div>\n        <h3>Instalado no seu computador</h3>\n        <p>Roda instalado no seu computador, não como site. Por isso organiza de verdade os arquivos do seu negócio — contratos, documentos, PDFs — nas suas próprias pastas, o que um app de navegador não alcança.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">02</div>\n        <h3>Processos</h3>\n        <p>Fase, partes, andamentos, documentos e providências de cada processo, com filtro por tipo de ação.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">03</div>\n        <h3>Prazos em dias úteis</h3>\n        <p>A contagem pula fins de semana e feriados, inclusive os da sua comarca, e cada providência vira uma tarefa.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">04</div>\n        <h3>Honorários e horas</h3>\n        <p>Fixo, êxito, fixo mais êxito, mensal ou por hora. As parcelas viram contas a receber e as horas trabalhadas são contadas por você ou pelo app.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">05</div>\n        <h3>Propostas de honorários</h3>\n        <p>Proposta com itens, condição de pagamento e histórico de revisões, enviada em PDF.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">06</div>\n        <h3>Agenda do escritório</h3>\n        <p>Audiências, reuniões e retornos por advogado, com a opção de espelhar no Google Agenda.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">07</div>\n        <h3>Financeiro</h3>\n        <p>Contas a pagar e a receber, a parte da equipe e as finanças pessoais separadas das do escritório.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">08</div>\n        <h3>Clientes e partes</h3>\n        <p>Clientes, partes contrárias e contatos do processo centralizados, sem duplicar em planilha.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">09</div>\n        <h3>Documentos do processo</h3>\n        <p>Petições, provas e documentos organizados por processo, prontos pra consultar quando precisar.</p>\n      </div>\n    </div>\n  </div>\n</section>\n\n<hr class=\"divider\">\n\n<section class=\"section-pad reveal\">\n  <div class=\"wrap\">\n    <span class=\"sheet-tag\">Fl.04 — Assista como funciona</span>\n    <div class=\"section-head\">\n      <h2>Veja o Dudoo Lite sendo usado.</h2>\n      <p>Imagens reais do programa, com a linguagem da advocacia: cadastros de clientes, agenda de advogados e o painel de processos.</p>\n    </div>\n    <div class=\"uso-grid\">\n      <figure class=\"uso-card\" st le=\"--pct:70%\"><span>70%</span></div>\n            <div class=\"proj-meta\">\n              <div class=\"proj-name\">Casamento Ana e Pedro</div>\n              <div class=\"proj-sub\">Sítio Bela Vista · 180 convidados · dia 14</div>\n            </div>\n            <div class=\"pill pill-warn\">Faltam 12 dias</div>\n          </div>\n          <div class=\"proj-card\">\n            <div class=\"ring\" style=\"--pct:100%\"><span>100%</span></div>\n            <div class=\"proj-meta\">\n              <div class=\"proj-name\">Aniversário de 15 anos da Júlia</div>\n              <div class=\"proj-sub\">Salão de festas · Layout pronto</div>\n            </div>\n            <div class=\"pill pill-ok\">Em dia</div>\n          </div>\n          <div class=\"proj-card\">\n            <div class=\"ring\" style=\"--pct:40%\"><span>40%</span></div>\n            <div class=\"proj-meta\">\n              <div class=\"proj-name\">Confraternização Alfa</div>\n              <div class=\"proj-sub\">Corporativo · 2 fornecedores sem confirmar</div>\n            </div>\n            <div class=\"pill pill-late\">Atenção</div>\n          </div>\n        </div>\n        <div class=\"preview-col\">\n          <div class=\"preview-col-label\">Atenções</div>\n          <div class=\"attn-item\">\n            <div class=\"attn-dot\" style=\"background:var(--error)\"></div>\n            <div>\n              <div class=\"attn-text\">Buffet ainda sem confirmação</div>\n              <div class=\"attn-proj\">Casamento Ana e Pedro</div>\n            </div>\n          </div>\n          <div class=\"attn-item\">\n            <div class=\"attn-dot\" style=\"background:var(--alert)\"></div>\n            <div>\n              <div class=\"attn-text\">12 convidados sem mesa definida</div>\n              <div class=\"attn-proj\">Casamento Ana e Pedro</div>\n            </div>\n          </div>\n          <div class=\"attn-item\">\n            <div class=\"attn-dot\" style=\"background:var(--alert)\"></div> aço arrastando blocos: mesas, mesa dos noivos, buffet, bar, DJ, palco, pista. Cada tipo de evento tem um modelo pronto, e as mesas desenhadas são as mesas do evento, com os nomes nas cadeiras. Salve como imagem.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">04</div>\n        <h3>Convidados e mesas</h3>\n        <p>Lista de convidados, confirmação, restrições e a distribuição por mesa, ligada ao desenho do salão.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">05</div>\n        <h3>Estimativa pelo histórico de cotações</h3>\n        <p>Cada orçamento de fornecedor fica guardado. Ao montar um evento novo, o Dudoo estima o custo pelo que já foi cotado e contratado, com faixa de preço e aviso quando a base ainda é pequena.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">06</div>\n        <h3>Acervo</h3>\n        <p>Os seus modelos num lugar só: modelos de festa, de documentos, listas padrão, pacotes e cardápios e o histórico de preços. Cada evento novo já nasce com o seu jeito de trabalhar.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">07</div>\n        <h3>Contrato e financeiro do evento</h3>\n        <p>Dados do contratante, contrato e condições a partir do seu modelo, parcelas e pagamentos do cliente ligados ao financeiro da empresa.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">08</div>\n        <h3>Fornecedores e orçamento</h3>\n        <p>Fornecedores por categoria, o que foi contratado e o que falta, com o orçamento do evento sempre à vista.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">09</div>\n        <h3>Cronograma, roteiro e livro da festa</h3>\n        <p>Linha do tempo do dia, roteiro da cerimônia e a playlist, reunidos em um PDF para a equipe e para o cliente.</p>\n      </div>\n    </div>\n  </div>\ amentos</h3>\n        <p>Proposta com histórico de todas as revisões — nunca mais \"qual foi a última versão que mandei pra esse cliente?\".</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">05</div>\n        <h3>Tarefas</h3>\n        <p>O que precisa ser feito, por cliente, com painel mostrando só o que exige ação agora.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">06</div>\n        <h3>Financeiro da empresa</h3>\n        <p>Contas a pagar e a receber num lugar só, sem três planilhas diferentes brigando entre si.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">07</div>\n        <h3>Financeiro pessoal e da equipe</h3>\n        <p>Separa o que é do negócio do que é seu — e o que é de cada colaborador — sem misturar tudo numa conta só.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">08</div>\n        <h3>Agenda</h3>\n        <p>Compromissos e retornos num só lugar, com opção de espelhar no Google Agenda, sem depender de outro app pra isso.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">09</div>\n        <h3>Documentos</h3>\n        <p>Contratos, propostas e PDFs do cliente gerados e guardados no histórico, prontos pra consultar quando precisar.</p>\n      </div>\n    </div>\n  </div>\n</section>\n\n<hr class=\"divider\">\n\n<section class=\"section-pad reveal\">\n  <div class=\"wrap\">\n    <span class=\"sheet-tag\">Fl.04 — Assista como funciona</span>\n    <div class=\"section-head\">\n      <h2>Veja o Dudoo Lite sendo usado.</h2>\n      <p>Imagens reais do programa: cadastro de clientes, a ficha com tudo em abas e o financeiro da empresa.</p>\n    </div>\n    <div class=\"uso-grid\">\n      <figure class=\"uso-card\" style=\"margin:0\">\n        <img src=\"https://static.wixstatic.com/media/5b9322_2988768243eb498e948f946e6276235e~mv2.gif\" alt=\"Cadastrar um e=\"text\" inputmode=\"numeric\" autocomplete=\"off\" maxlength=\"18\">\n        </div>\n        <div class=\"lead-field full\">\n          <label for=\"lite-mensagem\">O que mais te incomoda hoje na gestão do salão? (opcional)</label>\n          <textarea id=\"lite-mensagem\" name=\"mensagem\"></textarea>\n        </div>\n      </div>\n      <button class=\"btn btn-primary lead-submit\" type=\"submit\">Quero conhecer o Dudoo Lite</button>\n      <div class=\"lead-note\">Ao enviar, os dados chegam à nossa equipe para combinar o acesso ou uma demonstração — nenhum dado fica salvo neste site. O CPF ou CNPJ, se informado, é usado só para emitir a sua licença e a cobrança.</div>\n      <div class=\"lead-ok\" id=\"lite-ok\">Dados enviados.</div>\n    </form>\n  </div>\n</section>\n\n<section class=\"closing\">\n  <div class=\"wrap\">\n    <h2>Seu salão existe para <em>cuidar</em> de quem volta sempre.<br>Não para se perder em caderno.</h2>\n    <div class=\"sub\">O Dudoo Lite cuida do resto.</div>\n  </div>\n</section>\n\n<footer>\n  <div class=\"wrap footer-grid\">\n    <div>\n      <div class=\"footer-mark\"><img class=\"logo-icon\" src=\"{{LOGO}}\" width=\"30\" height=\"30\" alt=\"Dudoo\"> Dudoo<span>Lite</span></div>\n      <div class=\"footer-desc\">Dashboard Enxuto de Gestão para salão e estética, criado por Eduardo Schmidt a partir do núcleo do Dudoo.</div>\n    </div>\n    <div class=\"footer-code\">Fl.08 — Rodapé<br>Gestão enxuta para salões e estética</div>\n  </div>\n</footer>\n", "tricologia": "\n<nav class=\"nav\">\n  <div class=\"nav-inner\">\n    <div class=\"nav-mark\"><img class=\"logo-icon\" src=\"{{LOGO}}\" width=\"30\" height=\"30\" alt=\"Dudoo\"> Dudoo<span>Lite</span></div>\n    <a class=\"nav-cta\" href=\"#interesse\">Quero conhecer</a>\n  </div>\n</nav>\n\n<header class=\"hero blueprint\">\n  <div class=\"wrap\">\n    <div class=\"hero-eyebrow\">Gestão enxuta para tricologia</div>\n    <img class=\"hero-logo\" src=\"{{LOGO}}\" width=\"64\" height= n            <div class=\"proj-meta\">\n              <div class=\"proj-name\">Carlos Eduardo Reis</div>\n              <div class=\"proj-sub\">Consulta inicial · Orçamento enviado</div>\n            </div>\n            <div class=\"pill pill-warn\">Em aberto</div>\n          </div>\n          <div class=\"proj-card\">\n            <div class=\"ring\" style=\"--pct:40%\"><span>40%</span></div>\n            <div class=\"proj-meta\">\n              <div class=\"proj-name\">Juliana Martins</div>\n              <div class=\"proj-sub\">Retorno vencido há 5 dias</div>\n            </div>\n            <div class=\"pill pill-late\">Atenção</div>\n          </div>\n        </div>\n        <div class=\"preview-col\">\n          <div class=\"preview-col-label\">Atenções</div>\n          <div class=\"attn-item\">\n            <div class=\"attn-dot\" style=\"background:var(--error)\"></div>\n            <div>\n              <div class=\"attn-text\">Retorno vencido, paciente sem horário</div>\n              <div class=\"attn-proj\">Juliana Martins</div>\n            </div>\n          </div>\n          <div class=\"attn-item\">\n            <div class=\"attn-dot\" style=\"background:var(--alert)\"></div>\n            <div>\n              <div class=\"attn-text\">Orçamento aguardando resposta há 4 dias</div>\n              <div class=\"attn-proj\">Carlos Eduardo Reis</div>\n            </div>\n          </div>\n          <div class=\"attn-item\">\n            <div class=\"attn-dot\" style=\"background:var(--alert)\"></div>\n            <div>\n              <div class=\"attn-text\">Produto com estoque baixo</div>\n              <div class=\"attn-proj\">Loção do protocolo</div>\n            </div>\n          </div>\n          <div class=\"attn-item\">\n            <div class=\"attn-dot\" style=\"background:var(--success)\"></div>\n            <div>\n              <div class=\"attn-text\">Pagamento recebido</div>\n              <div class=\"attn-proj\">Ana Beatriz Lima</div>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<hr class=\"divider\">\n\n<section class=\"section-pad reveal\">\n  <div class=\"wrap\">\n    <span class=\"sheet-tag\">Fl.03 — Diferencial</span>\n    <div class=\"section-head\">\n      <h2>Feito para quem trata o couro cabeludo.</h2>\n      <p>Um sistema genérico não tem anamnese capilar, não compara foto de antes e depois e não entende o que é um retorno de protocolo. O Dudoo Lite nasceu do núcleo do Dudoo, usado todo dia em um escritório de verdade, e ganhou o jeito da clínica de tricologia.</p>\n    </div>\n    <div class=\"feature-grid\">\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">01</div>\n        <h3>Instalado no seu computador</h3>\n        <p>Roda instalado no seu computador, não como site. Por isso organiza de verdade os arquivos do seu negócio — contratos, documentos, PDFs — nas suas próprias pastas, o que um app de navegador não alcança.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">02</div>\n        <h3>Anamnese capilar</h3>\n        <p>As perguntas da entrevista inicial: queda, couro cabeludo, químicas, tratamentos, lavagem e calor, guardadas na ficha.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">03</div>\n        <h3>Prontuário</h3>\n        <p>Termos de consentimento e o registro de cada consulta, na aba Prontuário da ficha do paciente.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">04</div>\n        <h3>Fotos de antes e depois</h3>\n        <p>As fotos de cada fase, a evolução ao longo do tratamento e a imagem de antes e depois.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">05</div>\n        <h3>Planejamento do tratamento</h3>\n        <p>Parta de um protocolo pronto, ajuste ao paciente e emita o documento para entregar.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">06</div>\n        <h3>Agenda e retornos</h3>\n        <p>Consultas e retornos por colaborador, com a opção de espelhar no Google Agenda.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">07</div>\n        <h3>Financeiro e estoque</h3>\n        <p>Cobranças, pacotes e recibos por paciente, comissão da equipe e aviso quando um produto está acabando.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">08</div>\n        <h3>Tarefas do tratamento</h3>\n        <p>Retorno agendado, produto pra repor e o que mais precisa de atenção em cada paciente.</p>\n      </div>\n      <div class=\"feature-card\">\n        <div class=\"feature-num\">09</div>\n        <h3>Documentos e laudos</h3>\n        <p>Laudos, termos e orientações gerados e guardados no histórico de cada paciente.</p>\n      </div>\n    </div>\n  </div>\n</section>\n\n<hr class=\"divider\">\n\n<section class=\"section-pad reveal\">\n  <div class=\"wrap\">\n    <span class=\"sheet-tag\">Fl.04 — Assista como funciona</span>\n    <div class=\"section-head\">\n      <h2>Veja o Dudoo Lite sendo usado.</h2>\n      <p>Imagens reais do programa, com a linguagem da clínica: pacientes, consultas e procedimentos.</p>\n    </div>\n    <div class=\"uso-grid\">\n      <figure class=\"uso-card\" style=\"margin:0\">\n        <img src=\"https://static.wixstatic.com/media/5b9322_0399e8da606441c287750b5ec4b46775~mv2.gif\" alt=\"Cadastrar um paciente\" loading=\"lazy\">\n        <figcaption><strong>Cadastrar um paciente</strong>Nome, telefone e o que mais você souber. O resto se completa depois na ficha.</figcaption>\n      </figure>\n      <figure class=\"uso-card\" style=\"margin:0\">\n        <img src=\"https://static.wixstatic.com/media/5b9322_4b38355145d44f349beb9bbd74542a94~mv2.gif\" alt=\"Marcar uma consulta\" loading=\"lazy\">\n        <figcaption><strong>Marcar uma consulta</strong>Escolha o paciente, o procedimento e o horário. Ele aparece na agenda.</figcaption>\n      </figure>\n      <figure class=\"uso-card\" style=\"margin:0\">\n        <img src=\"https://static.wixstatic.com/media/5b9322_b347111b484d409f9ba5691e3be2e896~mv2.gif\" alt=\"Navegar pelo programa\" loading=\"lazy\">\n        <figcaption><strong>Navegar pelo programa</strong>A barra do topo leva a cada área: agenda, cadastros, financeiro e o que mais o seu negócio usa.</figcaption>\n      </figure>\n    </div>\n  </div>\n</section>\n\n<hr class=\"divider\">\n\n<section class=\"section-pad blueprint reveal\">\n  <div class=\"wrap\">\n    <span class=\"sheet-tag\">Fl.05 — Manifesto</span>\n    <div class=\"manifesto\">\n      <div>\n        <p class=\"manifesto-quote\">\"Eu sou <strong>arquiteto</strong>. Criei o Dudoo porque vivia o problema na pele, todo dia, no meu próprio escritório.\"</p>\n        <p class=\"manifesto-body\">Controlar cliente, orçamento, tarefa e financeiro não é um problema só de arquitetura: é o de qualquer negócio que vive de prestar serviço. O Dudoo Lite é o mesmo núcleo, testado em uso real, com a ficha, a anamnese e o prontuário que uma clínica de tricologia precisa.</p>\n      </div>\n      <div class=\"titleblock\">\n        <div class=\"titleblock-row\"><div class=\"k\">Projeto</div><div class=\"v\">Dudoo Lite</div></div>\n        <div class=\"titleblock-row\"><div class=\"k\">Autor</div><div class=\"v\">Eduardo Schmidt</div></div>\n        <div class=\"titleblock-row\"><div class=\"k\">Origem</div><div class=\"v\">Núcleo do Dudoo, testado em uso real</div></div>\n        <div class=\"titleblock-row\"><div class=\"k\">Pra quem</div><div class=\"v\">Clínicas de tricologia e tricologistas</div></div>\n        <div class=\"titleblock-sig\">Eduardo Schmidt</div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<hr class=\"divider\">\n\n<section class=\"section-pad reveal\">\n  <div class=\"wrap\">\n    <span class=\"sheet-tag\">Fl.06 — Antes / Depois</span>\n    <div class=\"section-head\">\n      <h2>A diferença não é a ferramenta. É a rotina.</h2>\n    </div>\n    <div class=\"ba-grid\">\n      <div class=\"ba-col before\">\n        <div class=\"ba-head\">Antes</div>\n        <ul class=\"ba-list\">\n          <li>Anamnese em papel, difícil de achar na consulta seguinte</li>\n          <li>Fotos do paciente perdidas na galeria do celular</li>\n          <li>Retorno combinado de cabeça, esquecido até o paciente cobrar</li>\n          <li>Cobrança e pacote anotados em planilha</li>\n          <li>Produto do protocolo que acaba sem ninguém perceber</li>\n        </ul>\n      </div>\n      <div class=\"ba-col after\">\n        <div class=\"ba-head\">Com o Dudoo Lite</div>\n        <ul class=\"ba-list\">\n          <li>Anamnese capilar guardada na ficha do paciente</li>\n          <li>Fotos organizadas por fase, com o antes e depois</li>\n          <li>Retorno na agenda, com alerta quando passa do prazo</li>\n          <li>Cobranças, pacotes e recibos por paciente</li>\n          <li>Aviso quando o estoque de um produto está baixo</li>\n        </ul>\n      </div>\n    </div>\n  </div>\n</section>\n\n<hr class=\"divider\">\n\n<section id=\"interesse\" class=\"section-pad reveal\">\n  <div class=\"wrap\">\n    <span class=\"sheet-tag\" style=\"justify-content:center\">Fl.07 — Ficha de interesse</span>\n    <div class=\"section-head\" style=\"margin:0 auto 40px;text-align:center;max-width:560px;\">\n      <h2>Quer testar o Dudoo Lite na sua clínica?</h2>\n      <p>Ainda em fase de validação, sem cobrança nesta etapa. Deixe seus dados que nossa equipe entra em contato para entender seu caso e combinar uma demonstração.</p>\n    </div>\n\n    <form class=\"lead-card\" id=\"form-interesse-lite\">\n      <div class=\"lead-grid\">\n        <div class=\"lead-field full\">\n          <label for=\"lite-nome\">Nome</label>\n          <input id=\"lite-nome\" name=\"nome\" type=\"text\" required>\n        </div>\n        <div class=\"lead-field\">\n          <label for=\"lite-empresa\">Clínica</label>\n          <input id=\"lite-empresa\" name=\"empresa\" type=\"text\" required>\n        </div>\n        <div class=\"lead-field\">\n          <label for=\"lite-segmento\">Segmento</label>\n          <input id=\"lite-segmento\" name=\"segmento\" type=\"text\" value=\"Tricologia\">\n        </div>\n        <div class=\"lead-field\">\n          <label for=\"lite-email\">E-mail</label>\n          <input id=\"lite-email\" name=\"email\" type=\"email\" required>\n        </div>\n        <div class=\"lead-field\">\n          <label for=\"lite-whatsapp\">WhatsApp</label>\n          <input id=\"lite-whatsapp\" name=\"whatsapp\" type=\"tel\" required>\n        </div>\n        <div class=\"lead-field\">\n          <label for=\"lite-cpf\">CPF ou CNPJ <small>(opcional, para agilizar a criação da sua licença)</small></label>\n          <input id=\"lite-cpf\" name=\"cpf_cnpj\" type=\"text\" inputmode=\"numeric\" autocomplete=\"off\" maxlength=\"18\">\n        </div>\n        <div class=\"lead-field full\">\n          <label for=\"lite-mensagem\">O que mais te incomoda hoje na gestão da clínica? (opcional)</label>\n          <textarea id=\"lite-mensagem\" name=\"mensagem\"></textarea>\n        </div>\n      </div>\n      <button class=\"btn btn-primary lead-submit\" type=\"submit\">Quero conhecer o Dudoo Lite</button>\n      <div class=\"lead-note\">Ao enviar, os dados chegam à nossa equipe para combinar o acesso ou uma demonstração — nenhum dado fica salvo neste site. O CPF ou CNPJ, se informado, é usado só para emitir a sua licença e a cobrança.</div>\n      <div class=\"lead-ok\" id=\"lite-ok\">Dados enviados.</div>\n    </form>\n  </div>\n</section>\n\n<section class=\"closing\">\n  <div class=\"wrap\">\n    <h2>Sua clínica existe para <em>tratar</em> quem confia nela.<br>Não para se perder em papel.</h2>\n    <div class=\"sub\">O Dudoo Lite cuida do resto.</div>\n  </div>\n</section>\n\n<footer>\n  <div class=\"wrap footer-grid\">\n    <div>\n      <div class=\"footer-mark\"><img class=\"logo-icon\" src=\"{{LOGO}}\" width=\"30\" height=\"30\" alt=\"Dudoo\"> Dudoo<span>Lite</span></div>\n      <div class=\"footer-desc\">Dashboard Enxuto de Gestão para tricologia, criado por Eduardo Schmidt a partir do núcleo do Dudoo.</div>\n    </div>\n    <div class=\"footer-code\">Fl.08 — Rodapé<br>Gestão enxuta para clínicas de tricologia</div>\n  </div>\n</footer>\n"};

class LandingDudooLite extends HTMLElement {
  static get observedAttributes() { return ['negocio']; }

  connectedCallback() {
    if (!this.shadowRoot) { this.attachShadow({ mode: 'open' }); }
    this._montar();
  }

  attributeChangedCallback() {
    if (this.shadowRoot) { this._montar(); }
  }

  _montar() {
    // 1º o atributo "negocio"; senão o final do endereço (/lite/advocacia); senão a página genérica
    let chave = (this.getAttribute('negocio') || '').trim().toLowerCase();
    if (!chave) {
      // último trecho do endereço: /lite/advocacia (os endereços antigos /dudoo-lite/... também valem)
      const trechos = String((JANELA_PAGINA.location || {}).pathname || '').toLowerCase().split('/').filter(Boolean);
      const ultimo = (trechos[trechos.length - 1] || '').replace(/^dudoo-lite-/, '');
      chave = NEGOCIOS[ultimo] ? ultimo : 'generico';
    }
    const negocio = NEGOCIOS[chave] || NEGOCIOS.generico;
    if (this._chave === chave) { return; }
    this._chave = chave;
    const raiz = this.shadowRoot;
    raiz.innerHTML = '<style>:host{all:initial;display:block;font-family:"Sora","Segoe UI",Arial,sans-serif;}' + CSS + '</style><div class="pagina">' + negocio.split('{{LOGO}}').join(LOGO) + '</div>';
    this._ligar(raiz, chave);
  }

  _ligar(raiz, chave) {
    raiz.querySelectorAll('a[href^="#"]').forEach((link) => {
      link.addEventListener('click', (evento) => {
        const alvo = raiz.getElementById(link.getAttribute('href').slice(1));
        if (alvo) { evento.preventDefault(); alvo.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      });
    });
    raiz.querySelectorAll('.reveal').forEach((el) => { el.classList.add('in'); });
    const form = raiz.getElementById('form-interesse-lite');
    if (form) {
      form.addEventListener('submit', (evento) => {
        evento.preventDefault();
        const dados = new FormData(form);
        const lead = { type: 'duda-lead', produto: 'Dudoo Lite', origem: 'duda-lite-' + chave };
        ['nome', 'empresa', 'segmento', 'email', 'whatsapp', 'cpf_cnpj', 'mensagem'].forEach((k) => { lead[k] = String(dados.get(k) || ''); });
        this.dispatchEvent(new CustomEvent('lead', { detail: lead, bubbles: true, composed: true }));
        const ok = form.querySelector('.lead-ok');
        if (ok) { ok.style.display = 'block'; }
      });
    }
  }
}

if (!customElements.get('landing-dudoo-lite')) {
  customElements.define('landing-dudoo-lite', LandingDudooLite);
}
// O painel do Wix às vezes não grava a tag nova e deixa a padrão (`wix-default-custom-element`): registrando as duas, a página funciona
// de qualquer jeito (12/11/2026, página principal /dudoo-lite saiu em branco por isso).
if (!customElements.get('wix-default-custom-element')) {
  customElements.define('wix-default-custom-element', class extends LandingDudooLite {});
}
