<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://dudoo.app.br/pagamento-nao-concluido/"><script data-goatcounter="https://dudoo.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<title>Pagamento não concluído — Dudoo Lite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F7F4EC; --surface:#FFFFFF; --border:#DCD3B9; --text:#201F1D; --text2:#67635A; --accent:#7E6A3F; --accent-hover:#6A5A35; --accent-ink:#FAF7EE; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141412; --surface:#201F1D; --border:#3A3935; --text:#FAFAF8; --text2:#A9A7A1; --accent:#B59B62; --accent-hover:#C7AE76; --accent-ink:#141412; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font-family:"Sora","Segoe UI",sans-serif; padding:24px; }
  main { width:100%; max-width:560px; }
  h1 { font-family:"Jost","Century Gothic",sans-serif; font-weight:600; font-size:30px; margin:0 0 6px; }
  p { color:var(--text2); line-height:1.55; margin:0 0 16px; }
  .cartao { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin:0 0 12px; }
  .cartao strong { display:block; margin-bottom:4px; }
  .cartao small { display:block; color:var(--text2); margin-bottom:12px; line-height:1.45; }
  a.botao { display:inline-block; background:var(--accent); color:var(--accent-ink); text-decoration:none; font-weight:600; padding:11px 20px; border-radius:8px; }
  a.botao:hover { background:var(--accent-hover); }
  .dica { font-size:13px; }
  [hidden] { display:none !important; }
</style></head>
<body><main>
  <h1>O pagamento não foi concluído</h1>
  <p>Nada foi cobrado. Se quiser tentar de novo, volte ao Dudoo Lite e peça o link outra vez, ou fale com o suporte.</p>
  <p class="dica">Qualquer dúvida no caminho, entre em contato para que possamos lhe ajudar!</p>
</main></body></html>
